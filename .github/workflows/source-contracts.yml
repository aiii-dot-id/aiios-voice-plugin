name: Source contracts (not model or installed qualification)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure model-free native contracts
        run: cmake -S runtime/native/session -B .build/native-contracts -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build .build/native-contracts --config Release --parallel 4
      - name: Run contracts
        run: ctest --test-dir .build/native-contracts -C Release --output-on-failure --no-tests=error
      - name: Prove nested C and C++ build paths are private
        run: python tests/test_native_source_privacy.py
      - name: Configure speaker-track state contracts (not model qualification)
        run: cmake -S runtime/native_multitalker -B .build/multitalker-contracts -DCMAKE_BUILD_TYPE=Release
      - name: Build speaker-track state contracts
        run: cmake --build .build/multitalker-contracts --config Release --parallel 2
      - name: Run speaker-track state contracts
        run: ctest --test-dir .build/multitalker-contracts -C Release --output-on-failure --no-tests=error

  publication-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies (never shipped in the plugin)
        run: python -m pip install -r requirements-test.txt
      - name: Verify tracked source inventory
        run: sha256sum --check --quiet MANIFEST.sha256
      - name: Check source and release-tag history for private data
        run: python -m scripts.check_public_privacy --history
      - name: Run package and catalog contracts without models or private evidence
        run: >-
          python -m pytest -q --fail-on-skips
          tests/test_catalog_preparation.py
          tests/test_release_status_scope.py
          tests/test_speaker_input_documentation.py
          tests/test_speaker_attribution_contract.py
          tests/test_speaker_aware_score.py
          tests/test_speaker_aware_reference.py
          tests/test_speaker_conditioned_export.py
          tests/test_speaker_aware_graphs.py
          tests/test_native_meeting_endurance.py
          tests/test_sdk_host_construction.py
          tests/test_public_privacy.py
          tests/test_native_binary_privacy.py
          tests/test_native_rebuild_libraries.py
          tests/test_native_pocket_link_contract.py
          tests/test_compact_multitalker_graphs.py
          tests/test_beta3_release_contract.py
          tests/test_qualified_runtime_stage.py
          tests/test_separated_signing_input.py
          tests/test_hearing_release_inventory.py
          tests/test_distribution_disposition.py
