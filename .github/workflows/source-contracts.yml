name: Source contracts (not model or installed qualification)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure model-free native contracts
        run: cmake -S runtime/native/session -B .build/native-contracts -DCMAKE_BUILD_TYPE=Release -DAII_WORKER_FIXTURE=ON
      - name: Build
        run: cmake --build .build/native-contracts --config Release --parallel 4
      - name: Run contracts
        run: ctest --test-dir .build/native-contracts -C Release --output-on-failure --no-tests=error
      - name: Configure native physical-path contracts
        run: cmake -S runtime/native/platform -B .build/path-contracts -DCMAKE_BUILD_TYPE=Release
      - name: Build native physical-path contracts
        run: cmake --build .build/path-contracts --config Release --parallel 2
      - name: Run native physical-path contracts
        run: ctest --test-dir .build/path-contracts -C Release --output-on-failure --no-tests=error
      - name: Prove nested C and C++ build paths are private
        run: python tests/test_native_source_privacy.py
      - name: Refuse incomplete Linux shader linkage
        if: runner.os == 'Linux'
        run: python tests/test_native_pocket_link_closure.py
      - name: Configure speaker-track state contracts (not model qualification)
        run: cmake -S runtime/native_multitalker -B .build/multitalker-contracts -DCMAKE_BUILD_TYPE=Release
      - name: Build speaker-track state contracts
        run: cmake --build .build/multitalker-contracts --config Release --parallel 2
      - name: Run speaker-track state contracts
        run: ctest --test-dir .build/multitalker-contracts -C Release --output-on-failure --no-tests=error

  publication-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
      - name: Install test dependencies (never shipped in the plugin)
        run: python -m pip install -r requirements-test.txt
      - name: Verify tracked source inventory
        run: python -m scripts.check_source_manifest
      - name: Check source and release-tag history for private data
        run: python -m scripts.check_public_privacy --history
      - name: Refuse a test module that no gate runs
        run: python -m pytest -q --fail-on-skips tests/test_every_test_module_has_a_gate.py
      - name: Prove compiled carrier binding is not an appended digest
        run: python -m pytest -q tests/test_carrier_runtime_binding.py tests/test_desktop_audit_declarations.py
      - name: Refuse unqualified portable audio transforms
        run: python -m pytest -q tests/test_portable_frontend_manifest.py
      - name: Build model-free resident topology fixture
        run: >-
          cmake -S runtime/native/session -B .build/topology-contracts
          -DCMAKE_BUILD_TYPE=Release -DAII_WORKER_FIXTURE=ON
      - name: Verify fixture configuration and parser integrity
        run: python -m pytest -q tests/test_native_fixture_configuration.py
      - name: Compile resident topology fixture and the enrollment codec probe
        run: cmake --build .build/topology-contracts --target aii_voice_worker_fixture aii_uid_snapshot_probe --parallel 4
      - name: Prove worker matches the copied host topology vectors
        env:
          AII_NATIVE_INTERRUPT_FIXTURE: ${{ github.workspace }}/.build/topology-contracts/aii_voice_worker_fixture
        run: python -m pytest -q --fail-on-skips tests/test_native_output_only.py tests/test_native_model_progress.py tests/test_native_settings_packaging.py
      - name: Hold the Python enrollment codec to the native one
        env:
          AII_UID_SNAPSHOT_PROBE: ${{ github.workspace }}/.build/topology-contracts/aii_uid_snapshot_probe
        run: python -m pytest -q --fail-on-skips tests/test_native_uid_snapshot.py
      - name: Run package and catalog contracts without models or private evidence
        run: >-
          python -m pytest -q --fail-on-skips
          tests/test_catalog_preparation.py
          tests/test_release_status_scope.py
          tests/test_release_model_bindings.py
          tests/test_shared_release_assets.py
          tests/test_speaker_input_documentation.py
          tests/test_speaker_attribution_contract.py
          tests/test_speaker_diagnostics.py
          tests/test_separator_audio.py
          tests/test_native_separator_gate.py
          tests/test_native_session_resources.py
          tests/test_separator_gather.py
          tests/test_separator_contractions.py
          tests/test_separator_uid_gate.py
          tests/test_speaker_aware_score.py
          tests/test_identity_attribution_score.py
          tests/test_speaker_aware_reference.py
          tests/test_speaker_conditioned_export.py
          tests/test_speaker_aware_graphs.py
          tests/test_native_meeting_endurance.py
          tests/test_sdk_host_construction.py
          tests/test_public_privacy.py
          tests/test_source_manifest.py
          tests/test_native_binary_privacy.py
          tests/test_release_image_census.py
          tests/test_loaded_recognizer_images.py
          tests/test_resident_signing_input.py
          tests/test_native_rebuild_libraries.py
          tests/test_native_pocket_link_contract.py
          tests/test_native_path_shim.py
          tests/test_compact_multitalker_graphs.py
          tests/test_beta3_release_contract.py
          tests/test_native_assembly_machine.py
          tests/test_authoring_sdk_binding.py
          tests/test_authoring_template.py
          tests/test_qualified_runtime_stage.py
          tests/test_separated_signing_input.py
          tests/test_hearing_release_inventory.py
          tests/test_distribution_disposition.py
          tests/test_hearing_distribution_disposition.py
          tests/test_third_party_notice_coverage.py
          tests/test_release_gates_refuse_optimised_python.py
      - name: Run source, package and release-tool contracts that need only Python
        run: >-
          python -m pytest -q --fail-on-skips
          tests/test_android_override_notice.py
          tests/test_engine_override_notice.py
          tests/test_prepare_engine_source.py
          tests/test_native_checkpoint_binding.py
          tests/test_native_cuda_speech_candidate.py
          tests/test_native_desktop_package_audit.py
          tests/test_native_desktop_sdk_audit.py
          tests/test_native_package_platforms.py
          tests/test_native_runtime.py
          tests/test_native_worker_wire_document.py
          tests/test_nemotron_composition.py
          tests/test_python_engine_is_not_built.py
          tests/test_release_checksums.py
          tests/test_restore_staged_native_checkpoint.py
          tests/test_runtime_limits.py
          tests/test_uid_gallery_readiness.py
          tests/test_windows_override_notice.py
      - name: Run the tests of the Python double (not of the engine that ships)
        run: >-
          python -m pytest -q --fail-on-skips
          tests/test_native_async.py
          tests/test_native_endpoint_backend.py
          tests/test_native_pocket_backend.py
          tests/test_native_pocket_profile.py
          tests/test_native_preview.py
          tests/test_native_profile.py
          tests/test_native_resident.py
          tests/test_native_stream.py
          tests/test_native_streaming.py
          tests/test_plugin_cuda_control.py
          tests/test_python_carrier_liveness.py
          tests/test_python_speaker_amendment.py
          tests/test_semantic_endpoint_late.py
      - name: Compile and run the native ownership, event and trace contracts
        run: >-
          python -m pytest -q --fail-on-skips
          tests/test_native_model_injection.py
          tests/test_native_owned_runtime_replace.py
          tests/test_native_speaker_observation.py
          tests/test_native_tts_phase_trace.py
          tests/test_uid_backend_binding.py
