name: AiiVoiceUIDFull
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CODE_SIGN_STYLE: Automatic
targets:
  AiiVoiceUIDFull:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Native
        excludes:
          - "CMakeLists.txt"
          - "**/LICENSE*"
          - "**/COPYING"
      - path: Resources
        buildPhase: resources
    dependencies:
      - sdk: CoreML.framework
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.aiii.voice.portability.wespeaker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Native", "$(SRCROOT)/Native/knf", "$(SRCROOT)/Native/kiss"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "KNF_ENABLE_CHECK=1"]
        OTHER_CFLAGS: ["$(inherited)", "-fno-fast-math", "-ffp-contract=on"]
